<script type="text/babel">
const { useState, useRef, useEffect } = React;

/* ───────────────────────── Shared Data ───────────────────────── */

const AVATARS = {
  'Alice Wang':    { initials: 'AW', bg: 'bg-blue-500' },
  'Bob Chen':      { initials: 'BC', bg: 'bg-emerald-500' },
  'Carol Davis':   { initials: 'CD', bg: 'bg-orange-500' },
  'Dan Kim':       { initials: 'DK', bg: 'bg-purple-500' },
  'Eva Lopez':     { initials: 'EL', bg: 'bg-pink-500' },
  'Frank Ito':     { initials: 'FI', bg: 'bg-teal-500' },
};

const Avatar = ({ name, size = 'w-8 h-8 text-xs' }) => {
  const a = AVATARS[name] || { initials: name.split(' ').map(w => w[0]).join('').slice(0,2), bg: 'bg-gray-400' };
  return <div className={`${size} ${a.bg} rounded-full flex items-center justify-center text-white font-semibold shrink-0`}>{a.initials}</div>;
};

const StatusBadge = ({ status }) => {
  const map = {
    'To Do':       'bg-gray-100 text-gray-600',
    'In Progress': 'bg-blue-50 text-blue-600',
    'In Review':   'bg-orange-50 text-orange-600',
    'Done':        'bg-emerald-50 text-emerald-600',
  };
  return <span className={`text-[11px] font-medium px-2 py-0.5 rounded-full ${map[status] || 'bg-gray-100 text-gray-500'}`}>{status}</span>;
};

const PriorityBadge = ({ priority }) => {
  const map = {
    'Critical': { cls: 'text-red-600 bg-red-50', icon: 'fa-circle-exclamation' },
    'High':     { cls: 'text-orange-600 bg-orange-50', icon: 'fa-arrow-up' },
    'Medium':   { cls: 'text-yellow-600 bg-yellow-50', icon: 'fa-minus' },
    'Low':      { cls: 'text-green-600 bg-green-50', icon: 'fa-arrow-down' },
  };
  const m = map[priority] || map['Medium'];
  return <span className={`text-[11px] font-medium px-2 py-0.5 rounded-full inline-flex items-center gap-1 ${m.cls}`}><i className={`fa-solid ${m.icon} text-[9px]`}/>{priority}</span>;
};

/* ───────────────── Mini SVG Charts ───────────────── */

const SparkLine = ({ data, color = '#0066FF', fill = false, w = 120, h = 32 }) => {
  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => `${(i / (data.length - 1)) * w},${h - ((v - min) / range) * (h - 4) - 2}`).join(' ');
  const fillPts = `0,${h} ${pts} ${w},${h}`;
  return (
    <svg width={w} height={h} className="overflow-visible">
      {fill && <polygon points={fillPts} fill={color} opacity="0.1" />}
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
};

const BarChart = ({ data, colors, w = 200, h = 80 }) => {
  const max = Math.max(...data.map(d => d.value));
  const bw = Math.min(24, (w - data.length * 4) / data.length);
  return (
    <svg width={w} height={h + 20}>
      {data.map((d, i) => {
        const bh = (d.value / max) * h;
        const x = i * (bw + 8) + 4;
        return (
          <g key={i}>
            <rect x={x} y={h - bh} width={bw} height={bh} rx="3" fill={d.color || colors?.[i] || '#0066FF'} opacity="0.85" />
            <text x={x + bw / 2} y={h + 14} textAnchor="middle" fontSize="9" fill="#9CA3AF">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
};

const DonutChart = ({ segments, size = 64 }) => {
  const r = 24; const cx = size/2; const cy = size/2; const circ = 2 * Math.PI * r;
  const total = segments.reduce((s, seg) => s + seg.value, 0);
  let offset = 0;
  return (
    <svg width={size} height={size}>
      {segments.map((seg, i) => {
        const pct = seg.value / total;
        const dash = pct * circ;
        const el = <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={seg.color} strokeWidth="10" strokeDasharray={`${dash} ${circ - dash}`} strokeDashoffset={-offset} transform={`rotate(-90 ${cx} ${cy})`} />;
        offset += dash;
        return el;
      })}
      <text x={cx} y={cy + 1} textAnchor="middle" fontSize="11" fontWeight="600" fill="#111827">{total}</text>
      <text x={cx} y={cy + 11} textAnchor="middle" fontSize="7" fill="#9CA3AF">tasks</text>
    </svg>
  );
};

const HeatCell = ({ value, max }) => {
  const intensity = max > 0 ? value / max : 0;
  const bg = intensity === 0 ? 'bg-gray-50' : intensity < 0.25 ? 'bg-yellow-100' : intensity < 0.5 ? 'bg-yellow-300' : intensity < 0.75 ? 'bg-orange-400' : 'bg-red-500';
  const text = intensity >= 0.5 ? 'text-white' : 'text-gray-700';
  return <div className={`w-10 h-8 rounded flex items-center justify-center text-[10px] font-medium ${bg} ${text}`}>{value > 0 ? value : ''}</div>;
};

/* ───────────────── Metric Card ───────────────── */

const MetricCard = ({ icon, label, value, trend, trendUp, small }) => (
  <div className={`bg-white rounded-xl border border-gray-100 shadow-sm ${small ? 'p-3 min-w-[130px]' : 'p-4 min-w-[155px]'} flex flex-col gap-1`}>
    <div className="flex items-center gap-1.5 text-txt-secondary">
      <i className={`fa-solid ${icon} text-[10px]`}/>
      <span className="text-[11px] font-medium">{label}</span>
    </div>
    <div className="text-xl font-bold text-txt-primary leading-tight">{value}</div>
    {trend && (
      <div className={`text-[11px] font-medium ${trendUp ? 'text-emerald-600' : 'text-red-500'}`}>
        <i className={`fa-solid ${trendUp ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down'} text-[9px] mr-0.5`}/>
        {trend}
      </div>
    )}
  </div>
);

/* ───────────────── Tab Shell ───────────────── */

/* ───────────────────────── PROJECTS TAB ───────────────────────── */

const projects = [

  { name: 'Backend API v2', desc: 'Migrate REST endpoints to new versioned API with improved auth', members: ['Bob Chen', 'Frank Ito', 'Dan Kim'], time: '5h ago', tasks: 16, completed: 9 },
  { name: 'Design System', desc: 'Unified component library with tokens, typography, and theme support', members: ['Carol Davis', 'Alice Wang'], time: '1d ago', tasks: 12, completed: 12 },
  { name: 'Analytics Pipeline', desc: 'Real-time event ingestion, signal detection, and dashboard reporting', members: ['Dan Kim', 'Eva Lopez', 'Frank Ito'], time: '2d ago', tasks: 19, completed: 7 },
  { name: 'Push Notifications', desc: 'Permission flow, device registration, and deep link handling', members: ['Eva Lopez', 'Bob Chen'], time: '3d ago', tasks: 8, completed: 5 },

const ProjectsTab = () => (

    <div className="px-4 pt-2 pb-3 bg-surface-secondary">
